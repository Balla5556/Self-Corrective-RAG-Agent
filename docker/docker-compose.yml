services:
  gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file: ../.env
    ports: ["8000:8000"]
    volumes: ["../data:/workspace/data"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 3
  dashboard:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file: ../.env
    command: ["streamlit", "run", "app/dashboard/streamlit_app.py", "--server.address=0.0.0.0"]
    ports: ["8501:8501"]
    volumes: ["../data:/workspace/data"]
    depends_on:
      gateway:
        condition: service_healthy
